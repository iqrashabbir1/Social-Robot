seed: 42
inputs:
  ros2_workspace: ros2_ws
  replay_source: outputs/logs/physiology_ros2_bridge.jsonl
outputs:
  latency_metrics: outputs/csv/cs1/latency_metrics.csv
  sync_error_timeseries: outputs/csv/cs1/sync_error_timeseries.csv
  fault_injection_results: outputs/csv/cs1/fault_injection_results.csv
simulation:
  steps: 84
  modes:
    - M1
    - M2
    - M3
    - M4
fault_injection:
  enabled: true
  profiles:
    - delay
    - dropout
    - sensor_noise
plot:
  save_png: true
  save_svg: true
