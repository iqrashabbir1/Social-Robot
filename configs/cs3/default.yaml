seed: 42
inputs:
  baseline_visual_log: tests/emotion_log_labeled.csv
  baseline_audio_dataset: data/speech/speech_dataset_crema.npz
outputs:
  output_subdir: ""
  model_performance_summary: outputs/csv/cs3/model_performance_summary.csv
  ablation_results: outputs/csv/cs3/ablation_results.csv
  training_curves: outputs/csv/cs3/training_curves.csv
dataset:
  n_samples: 480
  test_size: 0.25
label_space:
  - happy
  - sad
  - neutral
  - fear
models:
  classical_algorithms:
    - svm
    - random_forest
    - logistic_regression
  deep_variants:
    - name: late_fusion_mlp_small
      hidden_layers: [64, 32]
      learning_rate_init: 0.001
      epochs: 20
    - name: late_fusion_mlp_wide
      hidden_layers: [128, 64]
      learning_rate_init: 0.0008
      epochs: 20
  transformer_variants:
    - name: fusion_transformer_light
      hidden_dim: 16
      alpha: 0.0001
      epochs: 20
    - name: fusion_transformer_wide
      hidden_dim: 24
      alpha: 0.0002
      epochs: 20
  hybrid:
    enabled: true
    name: classical_deep_transformer_vote
    members:
      - B1_SVM
      - B2_1
      - B3_1
training:
  runtime_backend: cpu
  torch_device: auto
  deep_epochs: 20
  transformer_epochs: 20
  ablation_epochs: 14
  checkpoint_every: 0
  log_every: 5
  checkpoint_dir: outputs/logs/cs3_checkpoints/default
execution:
  include_baseline_b0: true
  include_classical_b1: true
  include_deep_b2: true
  include_transformer_b3: true
  include_missing_modality: true
  include_ablations: true
  main_modalities:
    - video
    - audio
    - context
  ablation_model_ids:
    - B1_SVM
    - B2_1
    - B3_1
  ablation_names:
    - video_only
    - audio_only
    - context_only
    - video_audio
    - video_audio_context
selection:
  primary_metric: macro_f1
  tie_breakers:
    - weighted_f1
    - accuracy
    - inference_latency_ms
  ascending_metrics:
    - inference_latency_ms
ablations:
  - video_only
  - audio_only
  - context_only
  - video_audio
  - video_audio_context
plot:
  save_png: true
  save_svg: true
