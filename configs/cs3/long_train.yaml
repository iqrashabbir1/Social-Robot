seed: 42
inputs:
  baseline_visual_log: tests/emotion_log_labeled.csv
  baseline_audio_dataset: data/speech/speech_dataset_crema.npz
outputs:
  output_subdir: long_train_comparison
  model_performance_summary: outputs/csv/cs3/long_train_comparison/model_performance_summary.csv
  ablation_results: outputs/csv/cs3/long_train_comparison/ablation_results.csv
  training_curves: outputs/csv/cs3/long_train_comparison/training_curves.csv
dataset:
  n_samples: 960
  test_size: 0.25
label_space:
  - happy
  - sad
  - neutral
  - fear
models:
  classical_algorithms:
    - svm
    - random_forest
  deep_variants:
    - name: late_fusion_mlp_small
      hidden_layers: [64, 32]
      learning_rate_init: 0.001
      epochs: 400
    - name: late_fusion_mlp_wide
      hidden_layers: [128, 64]
      learning_rate_init: 0.0008
      epochs: 700
  transformer_variants:
    - name: fusion_transformer_light
      hidden_dim: 16
      alpha: 0.0001
      epochs: 500
    - name: fusion_transformer_wide
      hidden_dim: 24
      alpha: 0.0002
      epochs: 700
  hybrid:
    enabled: true
    name: long_train_majority_vote
    members:
      - B1_SVM
      - B2_2
      - B3_2
training:
  deep_epochs: 300
  transformer_epochs: 300
  ablation_epochs: 100
  checkpoint_every: 100
  log_every: 25
  checkpoint_dir: outputs/logs/cs3_checkpoints/long_train_comparison
execution:
  include_baseline_b0: false
  include_classical_b1: true
  include_deep_b2: true
  include_transformer_b3: true
  include_missing_modality: false
  include_ablations: false
  main_modalities:
    - video
    - audio
    - context
  ablation_model_ids: []
  ablation_names: []
selection:
  primary_metric: macro_f1
  tie_breakers:
    - weighted_f1
    - accuracy
    - inference_latency_ms
  ascending_metrics:
    - inference_latency_ms
ablations:
  - video_only
  - audio_only
  - context_only
  - video_audio
  - video_audio_context
plot:
  save_png: true
  save_svg: true
