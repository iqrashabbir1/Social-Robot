experiment_name: example_model_experiment
case_study: CS3
seed: 42
inputs:
  baseline_visual_log: tests/emotion_log_labeled.csv
  baseline_audio_dataset: data/speech/speech_dataset_crema.npz
outputs:
  csv_dir: outputs/csv/cs3/example_model_experiment
  figure_dir: outputs/figures/cs3/example_model_experiment
modalities:
  selected:
    - video
    - audio
preprocessing:
  normalization: standard_scaler
  missing_modality_strategy: zero_fill
dataset:
  name: synthetic_aligned_multimodal_windows
  n_samples: 480
  test_size: 0.25
model:
  family: classical
  name: svm
  model_id: EXAMPLE
  hyperparameters:
    kernel: rbf
    C: 1.0
training:
  runtime_backend: cpu
  torch_device: auto
  epochs: 40
  batch_size: 128
  checkpoint_every: 0
evaluation:
  metrics:
    - accuracy
    - macro_f1
    - weighted_f1
    - uar
    - inference_latency_ms
  evidence_level: synthetic_placeholder_benchmark
plot:
  save_png: true
  save_svg: true
